name: Publicar demo (gh-pages)

on:
  push:
    branches: [claude/dazzling-fermat-2drsez]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir sitio
        run: |
          mkdir -p _site
          cp sinmail.html _site/index.html
          cp logos.html _site/logos.html
          cp sw.js manifest.webmanifest icon-180.png icon-192.png icon-512.png _site/
          touch _site/.nojekyll
      - name: Publicar en gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar demo SinMail (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
