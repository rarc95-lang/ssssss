<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>sinmail</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla de bienvenida -->
  <div id="welcome" class="screen hidden">
    <div class="welcome-content">
      <div class="logo logo-lg">
        <div class="logo-cut"></div>
      </div>
      <h1 class="wordmark wordmark-lg"><span class="wm-sin">sin</span><span class="wm-mail">mail</span></h1>
      <p class="welcome-sub">Una bandeja que entiende qué es urgente y qué espera respuesta. Privada y segura.</p>
      <a class="btn-google" href="/api/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Continuar con Google
      </a>
    </div>
  </div>

  <!-- Bandeja -->
  <div id="inbox" class="screen hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="logo logo-sm"><div class="logo-cut"></div></div>
          <span class="wordmark wordmark-sm"><span class="wm-sin">sin</span><span class="wm-mail">mail</span></span>
        </div>
        <div class="topbar-actions">
          <button id="btn-compose" class="icon-btn" title="Redactar">✎</button>
          <button id="btn-refresh" class="icon-btn" title="Refrescar">⟳</button>
          <button id="btn-logout" class="icon-btn icon-btn-text" title="Salir">Salir</button>
        </div>
      </div>
    </header>

    <main class="content">
      <h2 id="cat-title" class="big-title">Urgente</h2>
      <div id="sync-banner" class="sync-banner hidden"></div>
      <ul id="email-list" class="email-list"></ul>
      <div id="empty-state" class="empty-state hidden">Nada por aquí.</div>
    </main>

    <!-- Píldora flotante de categorías -->
    <nav class="pill">
      <button class="pill-item active" data-cat="urgente">Urgente<span class="badge hidden"></span></button>
      <button class="pill-item" data-cat="por_responder">Responder<span class="badge hidden"></span></button>
      <button class="pill-item" data-cat="para_leer">Leer<span class="badge hidden"></span></button>
      <button class="pill-item" data-cat="boletines">Boletines<span class="badge hidden"></span></button>
      <button class="pill-item" data-cat="archivo">Archivo<span class="badge hidden"></span></button>
    </nav>
  </div>

  <!-- Lectura de correo -->
  <div id="reader" class="screen hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <button id="btn-back" class="icon-btn icon-btn-text">‹ Volver</button>
        <div class="topbar-actions">
          <button id="btn-toggle-read" class="icon-btn icon-btn-text">No leído</button>
          <button id="btn-archive" class="icon-btn icon-btn-text">Archivar</button>
        </div>
      </div>
    </header>
    <main class="content reader-content">
      <div class="ai-summary">
        <span class="ai-chip">Resumen IA</span>
        <p id="r-resumen"></p>
      </div>
      <h2 id="r-asunto" class="reader-subject"></h2>
      <div class="reader-meta">
        <span id="r-remitente"></span>
        <span id="r-fecha" class="meta-secondary"></span>
      </div>
      <hr class="hairline">
      <div id="r-cuerpo" class="reader-body"></div>

      <div class="reply-box">
        <label class="reply-label">Responder con IA</label>
        <textarea id="reply-instruction" rows="2" placeholder="Escribe una instrucción breve: «acepto, propongo el jueves a las 10»"></textarea>
        <button id="btn-gen-reply" class="btn-primary">Generar borrador</button>
        <div id="draft-area" class="hidden">
          <textarea id="draft-body" rows="8"></textarea>
          <button id="btn-send-reply" class="btn-primary">Enviar respuesta</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Redactar nuevo -->
  <div id="composer" class="screen hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <button id="btn-compose-back" class="icon-btn icon-btn-text">‹ Cancelar</button>
        <span class="topbar-title">Nuevo correo</span>
        <button id="btn-compose-send" class="icon-btn icon-btn-text strong">Enviar</button>
      </div>
    </header>
    <main class="content">
      <input id="c-to" class="field" type="email" placeholder="Para">
      <input id="c-subject" class="field" type="text" placeholder="Asunto">
      <div class="compose-ai">
        <input id="c-instruction" class="field" type="text" placeholder="Instrucción para la IA (opcional)">
        <button id="btn-compose-ai" class="btn-secondary">Redactar con IA</button>
      </div>
      <textarea id="c-body" class="field" rows="12" placeholder="Escribe tu correo…"></textarea>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
